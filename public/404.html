<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#a3a8ad">
    <title>Page not found | Syoh Timofey</title>
    <link rel="icon" type="image/png" href="/favicon-64.png">
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(circle, #efede8, #9fa4a9 65%, #626970);
        color: #1e1d1a;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main { max-width: 30rem; }
      .brand { font-size: 1rem; }
      h1 { margin: 1.5rem 0 1rem; font-size: clamp(2rem, 8vw, 3rem); }
      p { line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.3rem;
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 2rem;
        background: rgb(255 255 255 / 35%);
        color: inherit;
        text-underline-offset: 0.2em;
      }
      a:focus-visible { outline: 2px solid #1e1d1a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Syoh Timofey</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Back to the home page</a>
    </main>
  </body>
</html>
