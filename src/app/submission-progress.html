<dialog
  #progressDialog
  class="submission-progress"
  aria-modal="true"
  [attr.aria-labelledby]="titleId()"
  [attr.aria-describedby]="descriptionId()"
  (cancel)="cancel($event)"
>
  <span class="submission-progress__spinner" aria-hidden="true"></span>
  <div role="status" aria-live="polite" aria-atomic="true">
    <h2 class="submission-progress__title" [id]="titleId()">{{ title() }}</h2>
    <p class="submission-progress__description" [id]="descriptionId()">Please wait a moment.</p>
  </div>
  <div #verificationContainer class="contact-form__verification"></div>
</dialog>
